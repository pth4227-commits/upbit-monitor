
name: Upbit read-only hourly snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: '15 * * * *'

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Read public Upbit market data
        run: python monitor.py
        
      - name: Analyze market risk and watchlist
        run: python analyze.py

      - name: Upload snapshot and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upbit-snapshot-${{ github.run_id }}
          path: output/
          retention-days: 7
          if-no-files-found: warn
